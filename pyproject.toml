[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prismabuild"
version = "0.1.0"
description = "Deterministic action keys, immutable CAS, and remote dispatch for quantization campaigns"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []          # stdlib-only, on purpose: workers must not need the numeric stack
authors = [{name = "Robert Tand", email = "robert.tand@icloud.com"}]

[project.optional-dependencies]
dev = ["pytest>=8", "PyYAML>=6"]

[project.scripts]
prismabuild = "prismabuild.core:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A passing test's tmp_path is removed when it ends, so a long shard on a small
# or inode-limited scratch (a RAM tmpfs) holds only its failing tests' files.
# pbtest forwards a command-line -o for this one key only (once, as all, failed
# or none) and refuses every other -o key, so the default lives in the sealed
# checkout.
tmp_path_retention_policy = "failed"

# TL3 runs checks by pytest node ID with this command (RobTand/trustladderiii
# harness). Test edits are the Python files under tests/; conftest.py files are
# test configuration, and the harness refuses to carry them into a check.
[tool.tl3.harness]
command = ["python", "-m", "pytest"]
test-files = ["tests/**/*.py"]
