[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prismabuild"
version = "0.1.0"
description = "Deterministic action keys, immutable CAS, and remote dispatch for quantization campaigns"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []          # stdlib-only, on purpose: workers must not need the numeric stack
authors = [{name = "Robert Tand", email = "robert.tand@icloud.com"}]

[project.optional-dependencies]
slurm = []                 # slurm.py shells out to sbatch/scontrol; nothing to install
dagster = ["dagster>=1.7"]
dev = ["pytest>=8", "PyYAML>=6"]

[project.scripts]
prismabuild = "prismabuild.core:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
