# Cgroup containment, per node.  Installed at /etc/slurm/cgroup.conf.

CgroupPlugin=autodetect
ConstrainCores=yes
ConstrainRAMSpace=yes
ConstrainSwapSpace=no
ConstrainDevices=yes

# Read the two limits above for what they actually are on this fleet.
#
# ConstrainRAMSpace does NOT bound CUDA allocations on GB10.  GPU and host share
# one 128 GB physical pool, and the cgroup memory controller does not charge
# device allocations to the job's cgroup -- so an action that allocates 60 GB of
# tensors is, as far as this limit is concerned, using almost nothing.  The
# limit is real for host memory and it is a fiction for GPU memory.  What
# actually bounds a GB10 box is the RealMemory budget in slurm.conf together
# with the shard count: admission, not containment.
#
# Neither limit reaches a Docker payload.  A container started by an action is
# reparented to containerd-shim and runs under dockerd's cgroup, not the job's,
# so it survives a kill of every process group below the job and is charged to
# nobody.  That is exactly why epilog.sh removes containers by the action's
# ownership label: the label is the only thing that connects a running container
# back to the job that started it.
#
# ConstrainDevices=yes is what stops a job that reserved no GRES from opening
# /dev/nvidia0 -- the same rule pbrun enforces from the other side by masking
# CUDA_VISIBLE_DEVICES for an action with no GPU demand.  Two enforcements of
# one rule, deliberately: the mask is a promise the action can break, and the
# device cgroup is not.
#
# The control devices below have to stay allowed for CUDA to initialize at all;
# they are not the GPU, they are the driver's control interfaces, and a job that
# was granted a GPU cannot use it without them.
AllowedDevicesFile=/etc/slurm/cgroup_allowed_devices_file.conf
