# Devices every job may open regardless of what GRES it was granted.
# Installed at /etc/slurm/cgroup_allowed_devices_file.conf on the two GB10 boxes
# (harmless on dl380g10, where the nvidia entries simply do not exist).
#
# The nvidia entries here are the driver's CONTROL interfaces, not the GPU.
# /dev/nvidia0 is deliberately absent: that one is the GRES, and a job that did
# not ask for it must not be able to open it.  But without nvidiactl and the
# UVM devices, CUDA cannot initialize even for a job that WAS granted the GPU --
# so leaving them out breaks the jobs this file exists to enable.
/dev/null
/dev/urandom
/dev/zero
/dev/sda*
/dev/cpu/*/*
/dev/pts/*
/dev/nvidiactl
/dev/nvidia-uvm
/dev/nvidia-uvm-tools
/dev/nvidia-modeset
