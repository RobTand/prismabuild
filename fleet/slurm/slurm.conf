# PrismaBuild fleet controller configuration.
#
# Every node runs an identical copy of this file at /etc/slurm/slurm.conf.
#
# Values marked [fleet_boxes.json] are the budgets tools/fleet/fleet_boxes.json
# already states for the pull queue, carried over unchanged: they were raised
# against measurement on 2026-09-04 (see that file's _measured_2026_09_04 note),
# and a scheduler that admits differently from the ledger it replaces would be a
# second, undocumented answer to the same question.
#
# Values marked [measured 2026-09-04] were read off each box with `lscpu` and
# `/proc/meminfo` on that date.  They are no longer placeholders: guessing a
# socket/core topology is how a node comes up DRAINED with "Low
# socket*core*thread count" and nobody can see why.  `slurmd -C` on each box
# during the install is a cross-check against these lines, not the thing that
# supplies them.

ClusterName=prismabuild
SlurmctldHost=dl380g10
SlurmUser=slurm
AuthType=auth/munge
CredType=cred/munge

StateSaveLocation=/var/spool/slurm/ctld
SlurmdSpoolDir=/var/spool/slurm/d
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
# Local disks, never /mnt/shared.  StateSaveLocation on NFS is a documented way
# to corrupt a controller's state, and this fleet's NFS server IS the controller
# box -- so a mount hiccup would take out the scheduler and its memory of what
# was running at the same moment.

# Cores and memory are both consumable, because both are demands pbrun already
# declares (--cpus and mem_gb).  On 2026-09-04 four `pytest -n 24` actions each
# declaring 4 GB were admitted to one 80-core box together, load average 371:
# memory was never the binding constraint on that work, and memory was all the
# admission arithmetic could weigh.
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

# Cgroup containment for cores, memory and devices, and the accounting that
# reads the same cgroups.  proctrack/cgroup is not optional here for a second
# reason: core._collect_worker_evidence attests SLURM_JOB_ID against this
# process's cgroup membership before it will run anything, so a job whose
# processes are not in a job_<id> cgroup is refused by the worker, not by SLURM.
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup,task/affinity
JobAcctGatherType=jobacct_gather/cgroup

SchedulerType=sched/backfill
MaxJobCount=10000
# FIFO within a priority, then backfill.  Age-based priority needs
# priority/multifactor, which needs slurmdbd, which this fleet does not yet run
# -- so the pull queue's starvation floor has no equivalent here yet.  That is a
# known gap, deliberately taken: see the runbook's deferred section.
PriorityType=priority/basic

# scancel sends TERM, waits KillWait, then KILL.  Thirty seconds because a
# PrismaBuild action can hold a GPU and a Docker container, and both want longer
# than the five-second default to put themselves down cleanly.
KillWait=30
# A node that went away comes back into service when it registers again, without
# an operator resuming it by hand.  This fleet's boxes reboot for their own
# reasons and nobody is watching sinfo at the time.
ReturnToService=2

# How long the controller keeps a finished job answerable by `scontrol show
# job`.  The default 300 s is the whole memory this fleet has of a completed
# job: with no slurmdbd, sacct is inert, so scontrol is the only reader that can
# report a terminal state and its exit code.  An hour covers an operator coming
# back to a pbrun that finished while they were away.
MinJobAge=3600

# Node-side cleanup: containers labelled with the finished action's owner, and
# the materialized checkout a killed job could not remove itself.  Epilog runs
# as root on the compute node with SLURM_JOB_ID set.  A non-zero Epilog DRAINS
# the node, so epilog.sh always exits 0 -- see the comment in that file.
Epilog=/etc/slurm/epilog.sh
EpilogMsgTime=30000

# No accounting database yet.  sacct answers nothing until slurmdbd is deployed;
# the lane knows this and reads scontrol/squeue instead.
AccountingStorageType=accounting_storage/none

GresTypes=gpu,shard

# -- Nodes ------------------------------------------------------------------
#
# NodeName must be the box's `hostname -s`.  sparklina's is gx10-6b77, so the
# friendly name is a Feature rather than the node name.
#
# Hostnames are Features too, on purpose: `pbrun --here` and a box-local
# checkout both produce a hostname tag, and this lane turns tags into
# --constraint.  Without the hostname as a Feature, every pinned action would
# be unschedulable.
#
# Gres: one whole GPU, plus shards.  `shard` schedules concurrency on a device
# without fencing its memory, which is the only honest thing to do on GB10 --
# GPU and host share one 128 GB physical pool and per-process GPU memory
# telemetry reads null.  A slot is therefore a share of attention, not a
# reservation of bytes; the memory budget below is what bounds the box.
#
# RealMemory is the fleet's admission budget, well under physical: the offer is
# what keeps concurrent agent compute from taking a box down.

# The two GB10 boxes are the same machine twice: 20 CPUs in two clusters of ten
# (Cortex-X925 x10 and Cortex-A725 x10), one thread per core, one NUMA node.
# SocketsPerBoard=2 is those two clusters, which is what hwloc reports them as;
# declaring one socket of twenty would be a topology the box does not have, and
# task/affinity binds against it.
#
# `gpu` and `cpu` are Features as well as partitions, because the pool workers
# announce `cpu` on a box with no GPU slots and a `pbrun --tag cpu` that placed
# on the pool must not be refused by sbatch.  Weight is the preference order
# when more than one node satisfies a request: the CPU box is weight 1 and the
# GPU boxes weight 10, so work that is allowed everywhere (`pbrun --anywhere`)
# lands on the CPU box while it has room and spills to a GPU box only when it
# is full.  A GPU box's memory is one pool shared with its GPU, so CPU work
# there is the last resort, not the default.

NodeName=sparky \
    CPUs=20 Boards=1 SocketsPerBoard=2 CoresPerSocket=10 ThreadsPerCore=1 \
    RealMemory=73728 \
    Gres=gpu:1,shard:2 \
    Feature=gb10,aarch64,sm121,gpu,sparky \
    Weight=10 \
    State=UNKNOWN
#   topology       [measured 2026-09-04]  lscpu: 20 CPUs, 2 clusters x 10, 1 thread
#   RealMemory     [fleet_boxes.json]     --mem-gb 72 of 124546 MiB physical
#   shard:2        [fleet_boxes.json]     --gpu-slots 2 (load 14.5/10 cores at 2)

NodeName=gx10-6b77 \
    CPUs=20 Boards=1 SocketsPerBoard=2 CoresPerSocket=10 ThreadsPerCore=1 \
    RealMemory=81920 \
    Gres=gpu:1,shard:3 \
    Feature=gb10,aarch64,sm121,gpu,sparklina,gx10-6b77 \
    Weight=10 \
    State=UNKNOWN
#   topology       [measured 2026-09-04]  identical to sparky
#   RealMemory     [fleet_boxes.json]     --mem-gb 80 of 124546 MiB physical
#   shard:3        [fleet_boxes.json]     --gpu-slots 3 (raised 2026-09-04 06:35)
#   sparklina      [fleet_boxes.json]     --tag sparklina, and _alias

NodeName=dl380g10 \
    CPUs=80 Boards=1 SocketsPerBoard=2 CoresPerSocket=20 ThreadsPerCore=2 \
    RealMemory=61440 \
    Feature=x86,x86_64,cpu,dl380g10 \
    Weight=1 \
    State=UNKNOWN
#   topology       [measured 2026-09-04]  lscpu: 2 sockets x 20 cores x 2 threads,
#                                         4 NUMA nodes
#   RealMemory     [fleet_boxes.json]     --mem-gb 60 of 301591 MiB physical
#   no Gres        [fleet_boxes.json]     --gpu-slots 0

# -- Partitions --------------------------------------------------------------
#
# `all` is the default because placement here is by Feature and GRES, not by
# partition: pbrun turns tags into --constraint and a GPU demand into --gres,
# and both already say everything about where an action may run.  The two
# hardware partitions exist for an operator who wants to name a half of the
# fleet by hand (`sinfo -p gpu`, a drain, a maintenance window).
#
# MaxTime is UNLIMITED on every partition, and no DefaultTime is set, so a job
# submitted with no --time has no deadline.  That is the fleet's policy, not an
# omission: elapsed time is not evidence that a worker is dead, and a limit
# chosen to exceed the largest job anyone has today is broken by the first
# larger one.  The lane sends --time only when the submitter asked for a
# deadline (pbrun --timeout-s), and SLURM enforces that one exactly.  A stalled
# job is reported by its liveness evidence and withdrawn by an operator; it is
# not killed by a clock.  The cost is that backfill cannot plan around a job
# with no limit; on three boxes running FIFO that is acceptable.

PartitionName=all Nodes=ALL Default=YES MaxTime=UNLIMITED State=UP
PartitionName=gpu Nodes=sparky,gx10-6b77 MaxTime=UNLIMITED State=UP
PartitionName=cpu Nodes=dl380g10 MaxTime=UNLIMITED State=UP
