# Generic resources, per node.  Installed at /etc/slurm/gres.conf on every box.
#
# `File=` is required, not decorative.  slurmd refuses to start when a SHARED
# gres (shard) has no SHARING gres bound to a device file -- measured on
# 25.11.2 in fleet/slurm/smoke on 2026-09-04:
#
#     error: SHARING configuration lacks "File" specification
#     error: SHARED specified without any SHARING found
#     fatal: failed to merge SHARED and SHARING configuration
#
# No AutoDetect -- and it is not available anyway: the fleet's 25.11.2 build
# ships no gpu_nvml.so, as Ubuntu's own 26.04 package does not either, so
# `AutoDetect=nvml` would be naming a plugin that is not there.  NVML
# autodetection is what a normal cluster uses, and on GB10
# it would be detecting into a fog: GPU and host share one 128 GB physical pool
# and per-process GPU memory telemetry reads null, so there is nothing for
# autodetect to divide.  Static declaration says exactly what is there.
#
# Counts marked [fleet_boxes.json] are the pull queue's own GPU-slot budgets,
# raised against measurement on 2026-09-04.  See that file's
# _measured_2026_09_04 note: at 2 slots gx10-6b77 read "full" with its SMs idle
# and 111 GB of 121 free, which is what raising it to 3 was measuring away.

# -- sparky ------------------------------------------------------------------
# One whole device, and two shards of it.  A shard schedules concurrency on the
# GPU without fencing its memory -- which is the only honest arrangement on
# unified memory, where a per-job GPU memory limit would be a number nothing
# enforces.  The memory bound is RealMemory in slurm.conf, not this.
NodeName=sparky Name=gpu File=/dev/nvidia0
NodeName=sparky Name=shard Count=2 File=/dev/nvidia0
#                              ^ [fleet_boxes.json] --gpu-slots 2

# -- gx10-6b77 (sparklina) ---------------------------------------------------
NodeName=gx10-6b77 Name=gpu File=/dev/nvidia0
NodeName=gx10-6b77 Name=shard Count=3 File=/dev/nvidia0
#                                 ^ [fleet_boxes.json] --gpu-slots 3

# dl380g10 declares no GRES: [fleet_boxes.json] --gpu-slots 0.  Its actions ask
# for none, so nothing needs to be said here for it.
