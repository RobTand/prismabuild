# Merge these jobs into the existing Prometheus configuration after confirming
# that its host can reach the endpoints. This is not a replacement config.
scrape_configs:
  - job_name: prismabuild
    scrape_interval: 10s
    scrape_timeout: 8s
    static_configs:
      - targets: ["192.168.1.180:9877"]

  - job_name: prismabuild-netdata
    scrape_interval: 10s
    scrape_timeout: 8s
    metrics_path: /api/v1/allmetrics
    params:
      format: [prometheus]
      source: [average]
      timestamps: ["no"]
    static_configs:
      - targets: ["192.168.1.180:19999"]
        labels: {host: sparky}
      - targets: ["192.168.1.110:19999"]
        labels: {host: sparklina}
      - targets: ["192.168.1.107:19999"]
        labels: {host: dl380g10}
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'netdata_(system_(cpu|ram|memory_some_pressure|memory_full_pressure|cpu_some_pressure)_.*|nvidia_smi_gpu_(power_draw|temperature|frame_buffer_memory_usage)_.*)'
        action: keep
