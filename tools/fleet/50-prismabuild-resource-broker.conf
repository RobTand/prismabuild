# PrismaBuild: never let an automatic library-update restart take the
# resource broker down under a running action.
#
# needrestart queues every running service whose process still maps an
# upgraded library and restarts the selection.  Stopping the broker closes
# every connected launcher's execution channel without its result: the
# launcher fails closed (return code 125, "resource broker closed without an
# execution result"), a payload that then runs to completion is recorded
# failed, and only explicit receipt reconciliation can recover it
# (RobTand/prismabuild#1378, dl380g10 2026-09-30, libssl3t64 upgrade).
#
# This excludes exactly the broker unit; OS updates stay enabled.  Deliberate
# PrismaBuild upgrades are unchanged: they drain the host's attempts and stop
# the service before install_resource_broker.sh will replace it.  The
# fragment is a needrestart conf.d snippet: it is evaluated as Perl after the
# main configuration, and its $nrconf{override_rc} entry is matched by
# needrestart's lexical-first-match rule.
$nrconf{override_rc}->{qr(^prismabuild-resource-broker\.service$)} = 0;
