version: 2.1
commands:
  gate-setup:
    steps:
      - checkout
      - run:
          name: Set up pinned gate environment
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            trap 'echo "NO_VERDICT: checkout/environment setup failed"' ERR
            export UV_CACHE_DIR="$HOME/.cache/uv"
            python_bin=""
            for attempt in 1 2 3; do
              if python_bin=$(uv python find 3.14 2>/dev/null); then break; fi
              if uv python install 3.14; then python_bin=$(uv python find 3.14); break; fi
            done
            if [ -z "$python_bin" ]; then
              python3 -c 'import sys; assert sys.version_info >= (3, 12), "Python >=3.12 required"'
              python_bin=$(command -v python3)
            fi
            ready=0
            for attempt in 1 2 3; do
              if uv venv --clear --python "$python_bin" .venv &&
                 uv pip install --python .venv/bin/python pytest==9.1.1 pytest-xdist==3.8.0 PyYAML==6.0.3; then
                ready=1; break
              fi
            done
            test "$ready" = 1
            echo 'export PATH="$PWD/.venv/bin:$PATH"' >> "$BASH_ENV"
            .venv/bin/python --version
            uv --version
            .venv/bin/python -m pip --version 2>/dev/null || true
            .venv/bin/python -c 'import pytest, xdist, yaml; print("pytest", pytest.__version__, "xdist", xdist.__version__, "PyYAML", yaml.__version__)'
  gate-execute:
    parameters:
      mode:
        type: string
      lane:
        type: string
        default: selection
    steps:
      - run:
          name: Plan and run << parameters.mode >> gate (<< parameters.lane >>)
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            trap 'echo "NO_VERDICT: planning or execution infrastructure failed"' ERR
            mkdir -p gate-artifacts test-results
            git fetch --no-tags origin main
            base=$(git merge-base origin/main HEAD)
            head=$(git rev-parse HEAD)
            python tools/ci/gate_select.py --base "$base" --head "$head" \
              --mode << parameters.mode >> --output gate-artifacts/plan.json \
              --files-output gate-artifacts/population.txt
            if [ "<< parameters.lane >>" = selection ]; then
              cp gate-artifacts/population.txt gate-artifacts/assigned.txt
            else
              python tools/ci/gate_partition.py --plan gate-artifacts/plan.json \
                --threshold 5 --lane << parameters.lane >> \
                --output gate-artifacts/lanes.json --files-output gate-artifacts/lane.txt
              if command -v circleci >/dev/null; then
                circleci tests split --split-by=timings --timings-type=filename \
                  < gate-artifacts/lane.txt > gate-artifacts/assigned.txt
              else
                circleci-agent tests split --split-by=timings --timings-type=filename \
                  < gate-artifacts/lane.txt > gate-artifacts/assigned.txt
              fi
            fi
            set +e
            python tools/ci/gate_run.py --plan gate-artifacts/plan.json \
              --files-from gate-artifacts/assigned.txt --workers 4 \
              --result gate-artifacts/result.json --junitxml test-results/gate.xml
            code=$?
            set -e
            case "$code" in
              0) echo 'GATE_PASS: all assigned tests passed';;
              1) echo 'GATE_TEST_FAILURE: pytest reported a failure';;
              *) echo 'NO_VERDICT: runner or pytest infrastructure failed';;
            esac
            exit "$code"
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: gate-artifacts
      - store_artifacts:
          path: test-results
jobs:
  pr-gate:
    machine: true
    resource_class: robtand/fast-arm64
    environment:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - gate-setup
      - gate-execute:
          mode: selection
  queue-gate-heavy:
    machine: true
    resource_class: robtand/fast-arm64
    parallelism: 2
    environment:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - gate-setup
      - gate-execute:
          mode: full
          lane: heavy
  queue-gate-light:
    machine: true
    resource_class: robtand/slow-x64
    parallelism: 2
    environment:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - gate-setup
      - gate-execute:
          mode: full
          lane: light
workflows:
  pull-requests:
    jobs:
      - pr-gate:
          filters:
            branches:
              ignore:
                - main
                - /mergify\/merge-queue\/.*/
                - /gate-canary\/.*/
  merge-queue:
    jobs:
      - queue-gate-heavy:
          filters:
            branches:
              only: /(?:mergify\/merge-queue|gate-canary)\/.*/
      - queue-gate-light:
          filters:
            branches:
              only: /(?:mergify\/merge-queue|gate-canary)\/.*/
