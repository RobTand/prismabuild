# Mergify merge queue for PrismaBuild. Tracking: #2428.
#
# CI runs as GitHub Actions checks on GitHub-hosted runners (Rob, 2026-10-31);
# they are free for this public repository and put no load on the fleet.
# Two steps:
# - Every pull request push runs "pr-gate", which selects tests by evidence
#   from the pull request's changes. A pull request needs it, and
#   "issue-link", to enter the queue.
# - Each batch is tested on a draft pull request that Mergify opens on a
#   mergify/merge-queue/ branch. There "gate" runs the full gate population on
#   the integrated SHA, split across hosted runners of both architectures. It
#   must pass before Mergify merges the batch.
#
# Add the "queue" label to queue a pull request and remove it to dequeue. A
# pull request that also carries "release" goes to the release queue, which is
# served first. When a batch's draft passes, Mergify merges the batch's
# original pull requests. Merging them (rather than the draft) keeps branch
# protection's "require a pull request" rule without a bypass actor.
#
# Batches grow from one pull request toward seven when the queue backs up, and
# two batches are tested at once. The gate runs the full population whatever
# the batch size, so bigger batches cost no more CI. A failed batch is split to
# find the pull request that broke it. The gate itself reruns a shard that
# ended without a test verdict; a test failure is never retried, so
# max_checks_retries stays 0.
# TL3's GitHub App requeues its own pull requests after Mergify dequeues them
# with "@mergifyio queue" or "requeue". Mergify's default restrictions refuse
# commands from a sender without write permission, so the app is allowed by
# name, alongside people with write permission.
#
# TL3's pull requests enter the default queue another way: TL3 tests each
# change through PrismaBuild and reviews it, posts its "TL3 approval" check on
# the reviewed head, then adds "tl3-queue". That pair replaces "queue" and
# "pr-gate". TL3 reads the batch draft's checks, not the pull request's own, so
# a pr-gate condition would leave a failing pull request unqueued without TL3
# noticing. The batch's full "gate" still has to pass before anything merges.
# TL3 finds its rule's check by name, so keep "Queue TL3-approved PRs".
commands_restrictions:
  queue:
    conditions:
      - or:
          - sender-permission>=write
          - sender=tl3-robtand[bot]
  requeue:
    conditions:
      - or:
          - sender-permission>=write
          - sender=tl3-robtand[bot]

merge_queue:
  mode: serial
  max_parallel_checks: 2
  reset_on_external_merge: always
  status_comments: outcomes
  queue_controls_comment: false
  queued_label: queued
  dequeued_label: dequeued

queue_rules:
  - name: release
    queue_conditions:
      - base = main
      - label = queue
      - label = release
      - -draft
      - check-success = pr-gate
    merge_conditions:
      - check-success = gate
    merge_method: merge
    batch_size: 1
    max_checks_retries: 0
    checks_timeout: 30 minutes
  - name: default
    queue_conditions:
      - base = main
      - -draft
      - or:
          - and:
              - label = queue
              - check-success = pr-gate
          - and:
              - label = tl3-queue
              - check-success = @tl3-robtand/TL3 approval
    merge_conditions:
      - check-success = gate
    merge_method: merge
    batch_size:
      min: 1
      max: 7
    batch_max_wait_time: 2 minutes
    max_checks_retries: 0
    checks_timeout: 30 minutes

priority_rules:
  - name: release changes first
    conditions:
      - label = release
    priority: high

pull_request_rules:
  - name: queue pull requests labelled "queue"
    conditions:
      - base = main
      - label = queue
      - -draft
    actions:
      queue:
  - name: Queue TL3-approved PRs
    conditions:
      - base = main
      - label = tl3-queue
      - -draft
      - check-success = @tl3-robtand/TL3 approval
    actions:
      queue:
        name: default
