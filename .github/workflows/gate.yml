name: Merge gate
'on':
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  # Test execution destinations. Control jobs bootstrap on the hosted x64 image.
  GATE_SHARDS: '16'
  GATE_RUNNERS: '["ubuntu-24.04","ubuntu-24.04-arm"]'
  PYTHONPATH: src:experiments
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  GIT_AUTHOR_NAME: PrismaBuild CI
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: PrismaBuild CI
  GIT_COMMITTER_EMAIL: ci@example.invalid
  GATE_BASE: ${{ github.event.pull_request.base.sha }}
  GATE_HEAD: ${{ github.event.pull_request.head.sha }}
jobs:
  runners:
    name: Resolve test runner labels
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      labels: ${{ steps.labels.outputs.labels }}
    steps:
      - id: labels
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os
          labels = json.loads(os.environ['GATE_RUNNERS'])
          if not labels or any(not isinstance(label, str) or not label for label in labels):
              raise ValueError('GATE_RUNNERS needs runner labels')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('labels=' + json.dumps(labels, separators=(',', ':')) + '\n')
          PYTHON
  pr-gate:
    name: pr-gate
    needs: runners
    if: >-
      ${{ always() && !(github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'mergify/merge-queue/') &&
      github.event.pull_request.user.login == 'mergify[bot]' &&
      github.event.pull_request.user.id == 37929162) &&
      !(github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'gate-canary')) }}
    runs-on: ${{ fromJSON(needs.runners.outputs.labels)[0] }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tools/ci/gate_requirements.txt
      - name: Install pinned test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "NO_VERDICT: dependency setup failed"; exit 75' ERR
          python -m pip install --retries 3 --timeout 30 -r tools/ci/gate_requirements.txt
          # Compatibility sandboxes intentionally hide /opt. Relocate the actual
          # installed runtime, preserving bytes, to their visible /usr tree.
          gate_python_prefix=$(python -c 'import sys; print(sys.base_prefix)')
          sudo install -d /usr/local/pb-gate-python
          sudo cp -a "$gate_python_prefix"/. /usr/local/pb-gate-python/
          sudo chown -R root:root /usr/local/pb-gate-python
          printf '%s\n' /usr/local/pb-gate-python/lib | sudo tee /etc/ld.so.conf.d/pb-gate-python.conf >/dev/null
          sudo ldconfig
          # Update installation metadata to the real copied stdlib location.
          # Isolated consumers use DESTSHARED after hiding the original /opt.
          sudo env GATE_ORIGINAL_PREFIX="$gate_python_prefix" /usr/local/pb-gate-python/bin/python - <<'PYTHON'
          import os, sys, sysconfig
          from pathlib import Path
          for config in Path(sysconfig.get_path('stdlib')).glob('_sysconfigdata_*.py'):
              config.write_text(config.read_text().replace(os.environ['GATE_ORIGINAL_PREFIX'], sys.base_prefix))
          PYTHON
          env -u LD_LIBRARY_PATH -u LD_PRELOAD /usr/local/pb-gate-python/bin/python --version
          echo /usr/local/pb-gate-python/bin >> "$GITHUB_PATH"
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends bubblewrap
          sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # These fixtures seal the roster's real worker-visible scratch path.
          gate_scratch=$(python -c 'import json; print(json.load(open("tools/fleet/fleet_boxes.json"))["action_tmpdir"])')
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$gate_scratch"
          echo "TMPDIR=$gate_scratch" >> "$GITHUB_ENV"
          bwrap --version
          env -u LD_LIBRARY_PATH -u LD_PRELOAD python --version
          python -m pip --version
          python -c 'import pytest, xdist, yaml; print("pytest", pytest.__version__, "xdist", xdist.__version__, "PyYAML", yaml.__version__)'
      - name: Select and run PR tests
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "NO_VERDICT: PR planning infrastructure failed"; exit 75' ERR
          mkdir -p gate-artifacts
          python tools/ci/gate_select.py --base "$GATE_BASE" --head "$GATE_HEAD"             --mode selection --output gate-artifacts/plan.json             --files-output gate-artifacts/population.txt --summary "$GITHUB_STEP_SUMMARY"
          if python tools/ci/gate_run.py --plan gate-artifacts/plan.json --workers 4             --result gate-artifacts/result.json --junitxml gate-artifacts/junit.xml; then
            code=0
          else
            code=$?
          fi
          case "$code" in
            0) marker=GATE_PASS;;
            1) marker=GATE_TEST_FAILURE;;
            *) marker=NO_VERDICT; code=75;;
          esac
          echo "$marker: PR selection" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-pr-${{ github.run_attempt }}
          path: gate-artifacts
          if-no-files-found: warn
          retention-days: 7
  plan:
    name: Plan full gate
    needs: runners
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository &&
      ((startsWith(github.head_ref, 'mergify/merge-queue/') &&
      github.event.pull_request.user.login == 'mergify[bot]' &&
      github.event.pull_request.user.id == 37929162) ||
      contains(github.event.pull_request.labels.*.name, 'gate-canary')) }}
    runs-on: ${{ fromJSON(needs.runners.outputs.labels)[0] }}
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Plan full coverage and balanced shards
        id: plan
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "NO_VERDICT: full planning infrastructure failed"; exit 75' ERR
          mkdir -p gate-artifacts
          python tools/ci/gate_select.py --base "$GATE_BASE" --head "$GATE_HEAD"             --mode full --output gate-artifacts/plan.json             --files-output gate-artifacts/population.txt --summary "$GITHUB_STEP_SUMMARY"
          runners=$(python - <<'PYTHON'
          import json, os
          labels = json.loads(os.environ['GATE_RUNNERS'])
          if int(os.environ['GITHUB_RUN_ATTEMPT']) % 2:
              labels.reverse()
          print(','.join(labels))
          PYTHON
          )
          python tools/ci/gate_partition.py matrix --files-from gate-artifacts/population.txt             --durations tools/ci/gate_durations.json --shards "$GATE_SHARDS"             --runners "$runners" --output gate-artifacts/matrix.json
          python - <<'PYTHON'
          import json, math, os
          from pathlib import Path
          matrix = json.loads(Path('gate-artifacts/matrix.json').read_text())
          for row in matrix['include']:
              row['timeout_minutes'] = max(15, math.ceil(row['estimated_seconds'] * 1.5 / 4 / 60) + 10)
          Path('gate-artifacts/job-matrix.json').write_text(json.dumps(matrix) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': matrix['include']}, separators=(',', ':')) + '\n')
              output.write('shards=' + str(matrix['shards']) + '\n')
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-plan-${{ github.run_attempt }}
          path: gate-artifacts
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-shadow-selection-${{ github.run_attempt }}
          path: gate-artifacts/plan.json
          retention-days: 7
  shards:
    name: shard-${{ matrix.index }}-a1
    needs: plan
    if: ${{ needs.plan.result == 'success' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tools/ci/gate_requirements.txt
      - name: Install pinned test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "NO_VERDICT: dependency setup failed"; exit 75' ERR
          python -m pip install --retries 3 --timeout 30 -r tools/ci/gate_requirements.txt
          # Compatibility sandboxes intentionally hide /opt. Relocate the actual
          # installed runtime, preserving bytes, to their visible /usr tree.
          gate_python_prefix=$(python -c 'import sys; print(sys.base_prefix)')
          sudo install -d /usr/local/pb-gate-python
          sudo cp -a "$gate_python_prefix"/. /usr/local/pb-gate-python/
          sudo chown -R root:root /usr/local/pb-gate-python
          printf '%s\n' /usr/local/pb-gate-python/lib | sudo tee /etc/ld.so.conf.d/pb-gate-python.conf >/dev/null
          sudo ldconfig
          # Update installation metadata to the real copied stdlib location.
          # Isolated consumers use DESTSHARED after hiding the original /opt.
          sudo env GATE_ORIGINAL_PREFIX="$gate_python_prefix" /usr/local/pb-gate-python/bin/python - <<'PYTHON'
          import os, sys, sysconfig
          from pathlib import Path
          for config in Path(sysconfig.get_path('stdlib')).glob('_sysconfigdata_*.py'):
              config.write_text(config.read_text().replace(os.environ['GATE_ORIGINAL_PREFIX'], sys.base_prefix))
          PYTHON
          env -u LD_LIBRARY_PATH -u LD_PRELOAD /usr/local/pb-gate-python/bin/python --version
          echo /usr/local/pb-gate-python/bin >> "$GITHUB_PATH"
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends bubblewrap
          sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # These fixtures seal the roster's real worker-visible scratch path.
          gate_scratch=$(python -c 'import json; print(json.load(open("tools/fleet/fleet_boxes.json"))["action_tmpdir"])')
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$gate_scratch"
          echo "TMPDIR=$gate_scratch" >> "$GITHUB_ENV"
          bwrap --version
          env -u LD_LIBRARY_PATH -u LD_PRELOAD python --version
          python -m pip --version
          python -c 'import pytest, xdist, yaml; print("pytest", pytest.__version__, "xdist", xdist.__version__, "PyYAML", yaml.__version__)'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate-plan-${{ github.run_attempt }}
          path: gate-artifacts
      - name: Compute assignment and run tests
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "NO_VERDICT: assignment or execution infrastructure failed"; exit 75' ERR
          python tools/ci/gate_partition.py shard --files-from gate-artifacts/population.txt             --durations tools/ci/gate_durations.json --shards "${{ needs.plan.outputs.shards }}"             --index "${{ matrix.index }}" --output-files gate-artifacts/assigned.txt
          printf '## Shard %s, attempt 1\n\n' '${{ matrix.index }}' >> "$GITHUB_STEP_SUMMARY"
          wc -l gate-artifacts/assigned.txt >> "$GITHUB_STEP_SUMMARY"
          if python tools/ci/gate_run.py --plan gate-artifacts/plan.json             --files-from gate-artifacts/assigned.txt --workers 4             --result gate-artifacts/result.json --junitxml gate-artifacts/junit.xml; then
            code=0
          else
            code=$?
          fi
          case "$code" in
            0) marker=GATE_PASS;;
            1) marker=GATE_TEST_FAILURE;;
            *) marker=NO_VERDICT; code=75;;
          esac
          echo "$marker: shard ${{ matrix.index }}, attempt 1" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Upload verdict and JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-result-${{ github.run_attempt }}-a1-${{ matrix.index }}
          path: |
            gate-artifacts/result.json
            gate-artifacts/junit.xml
          if-no-files-found: warn
          retention-days: 7
  host-capabilities:
    name: host-capabilities-${{ matrix.runner }}
    needs: runners
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'gate-canary') }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.runners.outputs.labels) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tools/ci/gate_requirements.txt
      - name: Install pinned test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "NO_VERDICT: capability setup failed"; exit 75' ERR
          python -m pip install --retries 3 --timeout 30 -r tools/ci/gate_requirements.txt
          # Compatibility sandboxes intentionally hide /opt. Relocate the actual
          # installed runtime, preserving bytes, to their visible /usr tree.
          gate_python_prefix=$(python -c 'import sys; print(sys.base_prefix)')
          sudo install -d /usr/local/pb-gate-python
          sudo cp -a "$gate_python_prefix"/. /usr/local/pb-gate-python/
          sudo chown -R root:root /usr/local/pb-gate-python
          printf '%s\n' /usr/local/pb-gate-python/lib | sudo tee /etc/ld.so.conf.d/pb-gate-python.conf >/dev/null
          sudo ldconfig
          # Update installation metadata to the real copied stdlib location.
          # Isolated consumers use DESTSHARED after hiding the original /opt.
          sudo env GATE_ORIGINAL_PREFIX="$gate_python_prefix" /usr/local/pb-gate-python/bin/python - <<'PYTHON'
          import os, sys, sysconfig
          from pathlib import Path
          for config in Path(sysconfig.get_path('stdlib')).glob('_sysconfigdata_*.py'):
              config.write_text(config.read_text().replace(os.environ['GATE_ORIGINAL_PREFIX'], sys.base_prefix))
          PYTHON
          env -u LD_LIBRARY_PATH -u LD_PRELOAD /usr/local/pb-gate-python/bin/python --version
          echo /usr/local/pb-gate-python/bin >> "$GITHUB_PATH"
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends bubblewrap
          mkdir -p capability-artifacts
          sudo -n id
          sysctl kernel.apparmor_restrict_unprivileged_userns | tee capability-artifacts/apparmor-before.txt
          if sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; then
            echo 'AppArmor userns restriction disabled in this disposable hosted VM'
          else
            echo 'Hosted VM refused AppArmor userns adjustment'
          fi
          sysctl kernel.apparmor_restrict_unprivileged_userns | tee capability-artifacts/apparmor-after.txt
      - name: Measure namespace compatibility after AppArmor adjustment
        continue-on-error: true
        env:
          PRISMABUILD_TEST_TIMEOUT_S: '300'
        run: |
          env -u LD_LIBRARY_PATH -u LD_PRELOAD python -m pytest -n 4 --dist=loadfile -q -ra \
            -o junit_family=xunit1 --junitxml=capability-artifacts/namespace.xml \
            tests/test_record_compatibility.py tests/test_current_receipt_compat_composition.py \
            tests/test_proof_runtime_observation.py::test_host_customization_file_root_selection
      - name: Measure the complete root population using passwordless sudo
        continue-on-error: true
        env:
          PRISMABUILD_TEST_TIMEOUT_S: '300'
        shell: bash
        run: |
          mapfile -t root_files < <(python - <<'PYTHON'
          import json
          from pathlib import Path
          files = set(json.loads(Path('tests/proof_execution.json').read_text())['root']['files'])
          files.update(json.loads(Path('tests/receipt_execution.json').read_text())['root_files'])
          print('\n'.join(sorted(files)))
          PYTHON
          )
          sudo -n env -u LD_LIBRARY_PATH -u LD_PRELOAD \
            PYTHONPATH="$PWD/src:$PWD/experiments" PRISMABUILD_TEST_TIMEOUT_S=300 \
            OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 \
            GIT_AUTHOR_NAME='PrismaBuild CI' GIT_AUTHOR_EMAIL=ci@example.invalid \
            GIT_COMMITTER_NAME='PrismaBuild CI' GIT_COMMITTER_EMAIL=ci@example.invalid \
            "$(command -v python)" -m pytest -n 4 --dist=loadfile -q -ra \
            -o junit_family=xunit1 --junitxml=capability-artifacts/root.xml "${root_files[@]}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-host-capabilities-${{ github.run_attempt }}-${{ matrix.runner }}
          path: capability-artifacts
          if-no-files-found: warn
          retention-days: 7
  retry-plan:
    name: Plan infrastructure retry
    if: ${{ always() && needs.plan.result == 'success' }}
    needs: [runners, plan, shards]
    runs-on: ${{ fromJSON(needs.runners.outputs.labels)[0] }}
    timeout-minutes: 10
    outputs:
      retry: ${{ steps.retry.outputs.retry }}
      matrix: ${{ steps.retry.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate-plan-${{ github.run_attempt }}
          path: gate-artifacts
      - name: Download first attempt verdicts
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: gate-result-${{ github.run_attempt }}-a1-*
          path: verdicts
      - name: Retry only missing verdicts
        id: retry
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "NO_VERDICT: retry planning infrastructure failed"; exit 75' ERR
          python tools/ci/gate_actions.py retries --plan gate-artifacts/plan.json             --matrix gate-artifacts/job-matrix.json --artifacts verdicts             --prefix gate-result-${{ github.run_attempt }} --output gate-artifacts/retry-matrix.json             >> "$GITHUB_OUTPUT"
  retry-shards:
    name: shard-${{ matrix.index }}-a2
    if: ${{ always() && needs.retry-plan.result == 'success' && needs.retry-plan.outputs.retry == 'true' }}
    needs: [plan, retry-plan]
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.retry-plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tools/ci/gate_requirements.txt
      - name: Install pinned test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "NO_VERDICT: dependency setup failed"; exit 75' ERR
          python -m pip install --retries 3 --timeout 30 -r tools/ci/gate_requirements.txt
          # Compatibility sandboxes intentionally hide /opt. Relocate the actual
          # installed runtime, preserving bytes, to their visible /usr tree.
          gate_python_prefix=$(python -c 'import sys; print(sys.base_prefix)')
          sudo install -d /usr/local/pb-gate-python
          sudo cp -a "$gate_python_prefix"/. /usr/local/pb-gate-python/
          sudo chown -R root:root /usr/local/pb-gate-python
          printf '%s\n' /usr/local/pb-gate-python/lib | sudo tee /etc/ld.so.conf.d/pb-gate-python.conf >/dev/null
          sudo ldconfig
          # Update installation metadata to the real copied stdlib location.
          # Isolated consumers use DESTSHARED after hiding the original /opt.
          sudo env GATE_ORIGINAL_PREFIX="$gate_python_prefix" /usr/local/pb-gate-python/bin/python - <<'PYTHON'
          import os, sys, sysconfig
          from pathlib import Path
          for config in Path(sysconfig.get_path('stdlib')).glob('_sysconfigdata_*.py'):
              config.write_text(config.read_text().replace(os.environ['GATE_ORIGINAL_PREFIX'], sys.base_prefix))
          PYTHON
          env -u LD_LIBRARY_PATH -u LD_PRELOAD /usr/local/pb-gate-python/bin/python --version
          echo /usr/local/pb-gate-python/bin >> "$GITHUB_PATH"
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends bubblewrap
          sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # These fixtures seal the roster's real worker-visible scratch path.
          gate_scratch=$(python -c 'import json; print(json.load(open("tools/fleet/fleet_boxes.json"))["action_tmpdir"])')
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$gate_scratch"
          echo "TMPDIR=$gate_scratch" >> "$GITHUB_ENV"
          bwrap --version
          env -u LD_LIBRARY_PATH -u LD_PRELOAD python --version
          python -m pip --version
          python -c 'import pytest, xdist, yaml; print("pytest", pytest.__version__, "xdist", xdist.__version__, "PyYAML", yaml.__version__)'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate-plan-${{ github.run_attempt }}
          path: gate-artifacts
      - name: Compute assignment and run tests
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "NO_VERDICT: assignment or execution infrastructure failed"; exit 75' ERR
          python tools/ci/gate_partition.py shard --files-from gate-artifacts/population.txt             --durations tools/ci/gate_durations.json --shards "${{ needs.plan.outputs.shards }}"             --index "${{ matrix.index }}" --output-files gate-artifacts/assigned.txt
          printf '## Shard %s, attempt 2\n\n' '${{ matrix.index }}' >> "$GITHUB_STEP_SUMMARY"
          wc -l gate-artifacts/assigned.txt >> "$GITHUB_STEP_SUMMARY"
          if python tools/ci/gate_run.py --plan gate-artifacts/plan.json             --files-from gate-artifacts/assigned.txt --workers 4             --result gate-artifacts/result.json --junitxml gate-artifacts/junit.xml; then
            code=0
          else
            code=$?
          fi
          case "$code" in
            0) marker=GATE_PASS;;
            1) marker=GATE_TEST_FAILURE;;
            *) marker=NO_VERDICT; code=75;;
          esac
          echo "$marker: shard ${{ matrix.index }}, attempt 2" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Upload verdict and JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-result-${{ github.run_attempt }}-a2-${{ matrix.index }}
          path: |
            gate-artifacts/result.json
            gate-artifacts/junit.xml
          if-no-files-found: warn
          retention-days: 7
  gate:
    name: gate
    if: >-
      ${{ always() && github.event.pull_request.head.repo.full_name == github.repository &&
      ((startsWith(github.head_ref, 'mergify/merge-queue/') &&
      github.event.pull_request.user.login == 'mergify[bot]' &&
      github.event.pull_request.user.id == 37929162) ||
      contains(github.event.pull_request.labels.*.name, 'gate-canary')) }}
    needs: [runners, plan, shards, retry-plan, retry-shards]
    # The aggregator must still start if label resolution was lost with its runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require a complete plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          if [ "$PLAN_RESULT" != success ]; then
            echo 'NO_VERDICT: full plan did not complete'
            exit 75
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate-plan-${{ github.run_attempt }}
          path: gate-artifacts
      - name: Download attempt verdicts
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: gate-result-${{ github.run_attempt }}-*
          path: verdicts
      - name: Aggregate complete coverage and final verdicts
        run: |
          python tools/ci/gate_actions.py finish --plan gate-artifacts/plan.json             --matrix gate-artifacts/job-matrix.json --artifacts verdicts             --prefix gate-result-${{ github.run_attempt }} --output gate-artifacts/final.json             --effective-output gate-artifacts/effective --summary "$GITHUB_STEP_SUMMARY"
      - name: Audit shadow selection
        if: always()
        continue-on-error: true
        run: |
          python tools/ci/gate_shadow.py --plan gate-artifacts/plan.json             --results gate-artifacts/effective/*/result.json             --junitxml gate-artifacts/effective/*/junit.xml             --output gate-artifacts/shadow-accuracy.json
          cat gate-artifacts/shadow-accuracy.json >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-final-${{ github.run_attempt }}
          path: gate-artifacts
          if-no-files-found: warn
          retention-days: 7
