name: Merge gate

# Bazel runs on BuildBuddy: the client on a Remote Bazel runner, every test on
# remote execution or on that runner. This workflow keeps only what needs
# GitHub context: queue-aware refs, Mergify scopes, the hosted lane and the
# required checks. See docs/bazel.md. Rolling back means reverting the PR that
# introduced it.
#
# Required checks keep their names. pr-gate (to enter the queue) comes from
# ordinary pull requests; gate (to merge) comes from Mergify's batch drafts.

'on':
  pull_request:
    # No label triggers: Mergify adds and removes its own labels on queued pull
    # requests, and each would rerun pr-gate, which the queue requires.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  GIT_AUTHOR_NAME: PrismaBuild CI
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: PrismaBuild CI
  GIT_COMMITTER_EMAIL: ci@example.invalid
  # Mergify's own batch drafts: same repository, merge-queue branch, Mergify's app user.
  BATCH_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.pull_request.user.login == 'mergify[bot]' && github.event.pull_request.user.id == 37929162 }}

jobs:
  bazel:
    name: Bazel
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      tests: ${{ steps.gate.outputs.tests }}
      base: ${{ steps.target.outputs.base }}
      head: ${{ steps.target.outputs.head }}
      scopes_uploaded: ${{ steps.uploaded.outputs.scopes_uploaded }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: refs
        name: Queue-aware base and head
        uses: Mergifyio/gha-mergify-ci@392d123d84a27960993927aec1f2cbb059fb95c1 # v27
        with:
          action: scopes-git-refs
      - id: target
        name: Commits to test
        env:
          REFS_BASE: ${{ steps.refs.outputs.base }}
          REFS_HEAD: ${{ steps.refs.outputs.head }}
          MERGE: ${{ github.sha }}
        # A batch draft tests its exact integrated head against Mergify's
        # queue-aware base. An ordinary pull request tests GitHub's merge
        # commit against its first parent, current main (#2540), so a stale
        # branch is tested as it would merge.
        run: |
          set -euo pipefail
          if [ "$BATCH_DRAFT" = true ]; then
            base="$REFS_BASE" head="$REFS_HEAD"
          else
            git fetch --quiet --no-tags origin "$MERGE"
            base="$(git rev-parse "$MERGE^1")" head="$MERGE"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - id: gate
        name: Select and test on BuildBuddy
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          BASE: ${{ steps.target.outputs.base }}
          HEAD: ${{ steps.target.outputs.head }}
          CHECKOUT: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        run: >-
          python3 tools/ci/remote_gate.py pr --base "$BASE" --head "$HEAD"
          --checkout "$CHECKOUT" --branch "$BRANCH"
      - id: token
        name: Require the Mergify token
        if: always() && steps.gate.outputs.scopes_ready == 'true'
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        # gha-mergify-ci skips scopes-upload and only warns when its token is empty.
        run: |
          if ! test -n "$MERGIFY_TOKEN"; then
            echo "::error::MERGIFY_TOKEN is empty; scopes cannot reach Mergify."
            exit 1
          fi
      - id: upload
        name: Upload scopes
        if: always() && steps.token.outcome == 'success'
        uses: Mergifyio/gha-mergify-ci@392d123d84a27960993927aec1f2cbb059fb95c1 # v27
        with:
          action: scopes-upload
          token: ${{ secrets.MERGIFY_TOKEN }}
          scopes: ${{ steps.gate.outputs.scopes }}
          all_scopes: ${{ steps.gate.outputs.all_scopes }}
      - id: uploaded
        if: always()
        env:
          OUTCOME: ${{ steps.upload.outcome }}
        run: |
          if [ "$OUTCOME" != success ]; then
            echo "::error::No scope list reached Mergify; the gate cannot pass."
            exit 1
          fi
          echo scopes_uploaded=true >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bazel-gate
          path: gate-output/
          retention-days: 7
          if-no-files-found: ignore

  hosted:
    name: Hosted lane
    # The few tests only a hosted runner can host (tools/bazel/nonhermetic.bzl)
    # run on every gate, beside the Bazel job, with the old gate tooling.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: files
        name: Hosted-lane files
        run: echo "files=$(python3 tools/ci/remote_gate.py hosted-files)" >> "$GITHUB_OUTPUT"
      - id: target
        name: The commit the Bazel job tests
        env:
          MERGE: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$BATCH_DRAFT" = true ]; then
            head="$(git rev-parse HEAD)"
          else
            git fetch --quiet --no-tags origin "$MERGE"
            git checkout --quiet --detach "$MERGE"
            head="$MERGE"
          fi
          echo "base=$(git rev-parse "$head^1")" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - name: Run the hosted-lane files as the old gate did
        if: steps.files.outputs.files != '[]'
        uses: ./.github/actions/hosted-lane
        with:
          base: ${{ steps.target.outputs.base }}
          head: ${{ steps.target.outputs.head }}
          files: ${{ steps.files.outputs.files }}

  pr-gate:
    name: pr-gate
    needs: [bazel, hosted]
    # Ordinary pull requests: not one of Mergify's batch drafts.
    if: always() && github.event_name == 'pull_request' && !(github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.pull_request.user.login == 'mergify[bot]' && github.event.pull_request.user.id == 37929162)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The aggregate reads tools/bazel/nonhermetic.bzl for the hosted lane's files.
          sparse-checkout: |
            tools/ci
            tools/bazel
          persist-credentials: false
      - name: Require Bazel's verdict, scopes and the hosted lane
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/ci/remote_gate.py aggregate

  gate:
    name: gate
    needs: [bazel, hosted]
    # Mergify's batch drafts: same repository, merge-queue branch, Mergify's app user.
    if: always() && github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.pull_request.user.login == 'mergify[bot]' && github.event.pull_request.user.id == 37929162)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The aggregate reads tools/bazel/nonhermetic.bzl for the hosted lane's files.
          sparse-checkout: |
            tools/ci
            tools/bazel
          persist-credentials: false
      - name: Require Bazel's verdict, scopes and the hosted lane
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/ci/remote_gate.py aggregate

  post-merge:
    name: Post-merge full run
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: prs
        name: Merged pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -o pipefail
          prs=$(git rev-list "$BEFORE..$AFTER" | while read -r sha; do
            gh api "repos/${GITHUB_REPOSITORY}/commits/$sha/pulls" --jq '.[].number'
          done | sort -nu | paste -sd, -)
          echo "prs=$prs" >> "$GITHUB_OUTPUT"
      - id: full
        name: Test everything on amd64 and arm64
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PRS: ${{ steps.prs.outputs.prs }}
        run: >-
          python3 tools/ci/remote_gate.py main --base "$BEFORE" --head "$AFTER"
          --branch main --prs "$PRS" --timeout 100
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: post-merge-${{ github.sha }}
          path: gate-output/
          retention-days: 90
          if-no-files-found: ignore

  post-merge-hosted:
    name: Post-merge hosted lane (${{ matrix.runner }})
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: files
        name: Hosted-lane files
        # On arm64, also what BuildBuddy's arm64 executors can't host.
        env:
          ARCH: ${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }}
        run: echo "files=$(python3 tools/ci/remote_gate.py hosted-files --arch "$ARCH")" >> "$GITHUB_OUTPUT"
      - name: Run every hosted-lane file
        if: steps.files.outputs.files != '[]'
        uses: ./.github/actions/hosted-lane
        with:
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          files: ${{ steps.files.outputs.files }}
