name: Full suite
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Classify results without filing issues or comments
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: full-suite-main
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download previous complete main baseline through REST
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I tools/ci/full_suite_report.py --history-only --output history
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-suite-history
          path: history/results.json
          retention-days: 7
  shards:
    needs: history
    runs-on: [self-hosted, pb-fleet, pb-suite]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: full-suite-history
          path: history
      - name: Run CPU population, including quarantine
        run: >-
          python tools/ci/full_suite_shard.py --shards 4 --shard ${{ matrix.shard }}
          --workers 4 --history history/results.json --output results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-suite-shard-${{ matrix.shard }}-attempt-1
          path: results/
          if-no-files-found: warn
          retention-days: 14
  retry:
    needs: [history, shards]
    if: always()
    runs-on: [self-hosted, pb-fleet, pb-suite]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: full-suite-shard-${{ matrix.shard }}-attempt-1
          path: previous
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: full-suite-history
          path: history
      - name: Retry once only when attempt one has no test verdict
        run: >-
          python tools/ci/full_suite_shard.py --shards 4 --shard ${{ matrix.shard }}
          --workers 4 --history history/results.json --previous previous --output results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-suite-shard-${{ matrix.shard }}-attempt-2
          path: results/
          if-no-files-found: ignore
          retention-days: 14
  report:
    needs: [history, shards, retry]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: full-suite-shard-*
          path: shards
      - name: Compare and report new failures
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Branch trials can file only by explicitly dispatching with dry_run=false.
          FULL_SUITE_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) || (github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch') }}
        run: |
          args=()
          if [ "$FULL_SUITE_DRY_RUN" = true ]; then args+=(--dry-run); fi
          python3 -I tools/ci/full_suite_report.py --input shards --output report --shards 4 "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-suite-results
          path: report/results.json
          if-no-files-found: error
          retention-days: 90
