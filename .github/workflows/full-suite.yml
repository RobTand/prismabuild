name: Full suite
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Classify without filing issues or comments
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: full-suite-main
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: plan
        run: |
          python3 -I tools/ci/full_suite_workflow.py plan --output full-suite-plan \
            --sha "$(git rev-parse HEAD)" --shards 16
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-suite-plan
          path: full-suite-plan
  suite:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Prepare dependencies with infrastructure retry
        run: |
          python -m pip install pytest==9.1.1 pytest-xdist==3.8.0 PyYAML==6.0.3 || \
            python -m pip install pytest==9.1.1 pytest-xdist==3.8.0 PyYAML==6.0.3
      - name: Run assigned CPU tests, retry only without a verdict
        env:
          SHARD_INDEX: ${{ matrix.index }}
        run: |
          python -I tools/ci/full_suite_workflow.py plan --population-only \
            --sha "$(git rev-parse HEAD)" --output full-suite-local
          python tools/ci/gate_partition.py shard --files-from full-suite-local/files.txt \
            --durations tools/ci/gate_durations.json --shards 16 --index "$SHARD_INDEX" \
            --output-files full-suite-local/assigned.txt
          mkdir -p full-suite-shard
          code=75
          for attempt in 1 2; do
            rm -f full-suite-shard/junit.xml full-suite-shard/result.json
            if python tools/ci/gate_run.py --plan full-suite-local/plan.json \
              --files-from full-suite-local/assigned.txt --workers 4 \
              --result full-suite-shard/result.json --junitxml full-suite-shard/junit.xml; then
              code=0
            else
              code=$?
            fi
            if [ "$code" -ne 75 ]; then break; fi
          done
          exit "$code"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-suite-shard-${{ matrix.index }}
          path: full-suite-shard
          if-no-files-found: warn
  report:
    needs: [plan, suite]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: full-suite-plan
          path: full-suite-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: full-suite-shard-*
          path: full-suite-input
      - name: Classify and report through GitHub REST
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || github.ref != 'refs/heads/main' }}
        run: |
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          python3 -I tools/ci/full_suite_workflow.py report --input full-suite-input \
            --manifest full-suite-plan/manifest.json --output full-suite-results/results.json "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-suite-results
          path: full-suite-results/results.json
          if-no-files-found: warn
          retention-days: 90
