name: Full suite report
on:
  status:
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      job_number:
        description: CircleCI full-suite-report job number on main
        required: true
        type: string
      sha:
        description: Exact main commit tested by CircleCI
        required: true
        type: string
      dry_run:
        description: Classify without filing issues or comments
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  report:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'status' && github.event.state != 'pending' &&
       (github.event.context == 'CircleCI Pipeline' || github.event.context == 'ci/circleci: full-suite-report')) ||
      (github.event_name == 'check_run' && github.event.check_run.name == 'full-suite-report')
    concurrency:
      group: full-suite-report-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Fetch public CircleCI artifacts and report through GitHub REST
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FULL_SUITE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=()
          if [ "$FULL_SUITE_DRY_RUN" = true ]; then args+=(--dry-run); fi
          python3 -I tools/ci/full_suite_bridge.py --event "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/full-suite-report/results.json" "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-suite-results
          path: ${{ runner.temp }}/full-suite-report/results.json
          if-no-files-found: ignore
          retention-days: 90
