name: Issue link
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  issue-link:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commit that the v9.0.0 tag resolves to.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const pull = context.payload.pull_request;
            const body = pull.body || '';
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const escaped = repo.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const pattern = new RegExp(`\\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|refs?|references?)\\s+(?:https://github\\.com/${escaped}/issues/|${escaped}#|#)([1-9][0-9]*)\\b`, 'gi');
            const numbers = [...new Set([...body.matchAll(pattern)].map(m => Number(m[1])))];
            for (const issue_number of numbers) {
              try {
                const {data} = await github.rest.issues.get({...context.repo, issue_number});
                if (!data.pull_request) {
                  core.info(`Accepted the pull request body reference to issue #${issue_number}.`);
                  return;
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            const query = `query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  closingIssuesReferences(first: 100) {
                    nodes { number repository { nameWithOwner } }
                  }
                }
              }
            }`;
            const response = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: pull.number,
            });
            const nodes = response.repository.pullRequest.closingIssuesReferences.nodes || [];
            const sidebar = nodes.filter((node) =>
              node && node.repository
              && node.repository.nameWithOwner === repo
              && Number.isInteger(node.number));
            if (sidebar.length > 0) {
              core.info(`Accepted linked issue #${sidebar[0].number} from the pull request sidebar.`);
              return;
            }
            core.setFailed(
              'This pull request links no issue in this repository. Satisfy the policy either way: '
              + 'write "Refs #123" in the pull request body (Fixes, Closes and Resolves also count, and close the issue on merge), '
              + 'or link the issue under "Development" in the pull request sidebar. '
              + 'Use "Refs #123" when the issue must stay open after the merge.');
