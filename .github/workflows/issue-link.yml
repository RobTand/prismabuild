name: Issue link
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  issue-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const escaped = repo.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const pattern = new RegExp(`\\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|refs?|references?)\\s+(?:https://github\\.com/${escaped}/issues/|${escaped}#|#)([1-9][0-9]*)\\b`, 'gi');
            const numbers = [...new Set([...body.matchAll(pattern)].map(m => Number(m[1])))];
            for (const issue_number of numbers) {
              try {
                const {data} = await github.rest.issues.get({...context.repo, issue_number});
                if (!data.pull_request) return;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            core.setFailed('Link a real issue in this repository using Refs #123, Fixes #123, Closes #123, or Resolves #123.');
