name: Flake census
'on':
  push:
    branches: [prismabuild-2428-flake-census]
    paths: [.github/workflows/flake-census.yml]
  workflow_dispatch:
    inputs:
      repeats:
        description: Independent samples per architecture, from 2 to 10
        type: number
        default: 5
      dry_run:
        description: Classify and publish artifacts without filing issues
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: full-suite-main
  cancel-in-progress: false
env:
  CENSUS_SHARDS: '4'
  PYTHONPATH: src:experiments
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  GIT_AUTHOR_NAME: PrismaBuild CI
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: PrismaBuild CI
  GIT_COMMITTER_EMAIL: ci@example.invalid
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: control
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: main
        path: population
        fetch-depth: 0
        persist-credentials: false
    - id: plan
      env:
        REPEATS: ${{ inputs.repeats || 3 }}
      run: >-
        python3 -I control/tools/ci/flake_census.py plan --root population
        --repeats "$REPEATS" --shards "$CENSUS_SHARDS" --output census-plan
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: census-plan-${{ github.run_attempt }}
        path: census-plan
        retention-days: 30
  samples:
    needs: plan
    name: sample-${{ matrix.index }}-${{ matrix.architecture }}-r${{ matrix.repeat }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: control
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.plan.outputs.sha }}
        path: population
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: population/tools/ci/gate_requirements.txt
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: census-plan-${{ github.run_attempt }}
        path: census-plan
    - name: Recompute assignment with the shared gate partitioner
      run: >-
        python3 -I control/tools/ci/flake_census.py assign --root population
        --manifest census-plan/manifest.json --index ${{ matrix.index }}
        --output census-output/assigned.txt
    - name: Prepare hosted runtime for assigned files
      working-directory: population
      run: |
        set -Eeuo pipefail
        python -m pip install --retries 3 --timeout 30 -r tools/ci/gate_requirements.txt
        python tools/ci/gate_setup.py --files-from ../census-output/assigned.txt
    - name: Record this independent sample without retrying test failures
      working-directory: population
      shell: bash
      run: |
        set -Eeuo pipefail
        if python tools/ci/gate_run.py --plan ../census-plan/plan.json \
          --files-from ../census-output/assigned.txt --workers 4 \
          --result ../census-output/result.json --junitxml ../census-output/junit.xml; then
          code=0
        else
          code=$?
        fi
        echo "CENSUS_SAMPLE: index=${{ matrix.index }} pytest/gate exit=$code"
        # Test failures are observations. Infrastructure failures leave the census incomplete.
        if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then exit "$code"; fi
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: census-${{ github.run_attempt }}-${{ matrix.index }}
        path: census-output
        if-no-files-found: warn
        retention-days: 30
  report:
    needs: [plan, samples]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: control
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: census-plan-${{ github.run_attempt }}
        path: census-plan
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      continue-on-error: true
      with:
        pattern: census-${{ github.run_attempt }}-*
        path: census-input
    - name: Classify repeats and file only unowned intermittent nodes
      if: always()
      env:
        GITHUB_TOKEN: ${{ github.token }}
        DRY_RUN: ${{ inputs.dry_run || github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main' }}
      shell: bash
      run: |
        args=()
        if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
        python3 -I control/tools/ci/flake_census.py report \
          --manifest census-plan/manifest.json --input census-input \
          --artifact-prefix "census-${{ github.run_attempt }}-" \
          --output census-results/results.json "${args[@]}"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: flake-census-results
        path: census-results
        if-no-files-found: warn
        retention-days: 90
