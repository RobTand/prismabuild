name: Release dry-run
on:
  workflow_dispatch:
permissions: {}
jobs:
  release-dry-run:
    if: github.ref == 'refs/heads/main' && github.repository == 'RobTand/prismabuild'
    runs-on: [self-hosted, linux, x64, fleet]
    timeout-minutes: 10
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_TERMINAL_PROMPT: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Fetch the exact public source without credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          cd "$(mktemp -d "$RUNNER_TEMP/release-source.XXXXXXXX")"
          git init --quiet
          git -c credential.helper= fetch --depth=1 https://github.com/RobTand/prismabuild.git "$CANDIDATE_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "RELEASE_SOURCE=$PWD" >> "$GITHUB_ENV"
      - name: Build the valid candidate and reject an invalid candidate
        shell: bash
        run: |
          set -euo pipefail
          cd "$RELEASE_SOURCE"
          candidate=$(python3 -c 'import tomllib; print("v" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python3 tools/ci/release_dry_run.py "$candidate" --report "$RUNNER_TEMP/release-good.json"
          if python3 tools/ci/release_dry_run.py v999999.0.0 --report "$RUNNER_TEMP/release-bad.json"; then
            echo 'Invalid release candidate unexpectedly passed' >&2
            exit 1
          fi
          python3 -c 'import json, sys; report = json.load(open(sys.argv[1])); assert report["outcome"] == "FAIL" and "does not match project version" in report["reason"]' "$RUNNER_TEMP/release-bad.json"
          cat "$RUNNER_TEMP/release-good.json" "$RUNNER_TEMP/release-bad.json" >> "$GITHUB_STEP_SUMMARY"
