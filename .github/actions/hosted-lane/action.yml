name: Hosted lane
description: >-
  Run gate files that need a GitHub-hosted runner (tools/bazel/nonhermetic.bzl,
  tag "hosted") exactly as the old hosted gate ran a shard: pinned packages,
  tools/ci/gate_setup.py, then tools/ci/gate_run.py on the full-mode plan.
inputs:
  base:
    description: Commit the per-test budgets may not grow against
    required: true
  head:
    description: Commit under test; the caller has checked it out
    required: true
  files:
    description: JSON list of repository-relative test files
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: tools/ci/gate_requirements.txt
    - name: Install pinned test dependencies
      shell: bash
      run: python -m pip install --retries 3 --timeout 30 -r tools/ci/gate_requirements.txt
    - name: Plan and prepare
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
        FILES: ${{ inputs.files }}
      run: |
        set -euo pipefail
        mkdir -p gate-artifacts
        python -c 'import json, os; print("\n".join(json.loads(os.environ["FILES"])))' > gate-artifacts/assigned.txt
        cat gate-artifacts/assigned.txt
        python tools/ci/gate_select.py --base "$BASE" --head "$HEAD" --mode full --output gate-artifacts/plan.json
        python tools/ci/gate_setup.py --files-from gate-artifacts/assigned.txt
    - name: Run the assigned files
      shell: bash
      env:
        PYTHONPATH: src:experiments
      run: >-
        python tools/ci/gate_run.py --plan gate-artifacts/plan.json
        --files-from gate-artifacts/assigned.txt --workers 4
        --result gate-artifacts/result.json --junitxml gate-artifacts/junit.xml
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: hosted-lane-${{ runner.arch }}
        path: gate-artifacts/
        retention-days: 7
        if-no-files-found: ignore
